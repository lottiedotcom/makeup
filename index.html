<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>makeup</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d8cce6">
</head>
<body>
    <!-- The Magnifying Eyedropper -->
    <div id="magnifier-container">
        <canvas id="magnifier" width="80" height="80"></canvas>
        <div class="crosshair"></div>
    </div>

    <div class="app-container">
        <header class="bubble-panel">
            <h1>makeup</h1>
            <p>Your digital palette & challenge generator</p>
            <button id="installBtn" class="bubble-btn primary hidden" style="margin-top: 10px;">📲 Install App</button>
        </header>

        <section class="bubble-panel">
            <h2>1. Upload Palettes</h2>
            <p class="instruction">Upload as many palettes as you want. You'll be asked to name each one!</p>
            
            <label for="imageLoader" class="bubble-btn secondary file-upload-btn">Upload a Palette</label>
            <input type="file" id="imageLoader" accept="image/*" class="hidden-input">
            
            <div class="canvas-container hidden" id="canvasWrapper">
                <canvas id="imageCanvas"></canvas>
            </div>
            <p class="instruction" id="tapInstruction" style="display:none;">Press, drag, and release to extract a color!</p>
        </section>

        <section class="bubble-panel">
            <h2>2. Digital Color Pool</h2>
            <div id="paletteDisplayContainer"></div>
            <button id="clearPaletteBtn" class="bubble-btn secondary hidden" style="margin-top: 15px;">Clear All Palettes</button>
        </section>

        <section class="bubble-panel">
            <h2>3. Challenge Generator</h2>
            
            <!-- Replaced the dropdown with action buttons -->
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button id="quickRollBtn" class="bubble-btn secondary" style="margin-top: 0;">🎲 Quick Roll</button>
                <button id="startQuizBtn" class="bubble-btn primary" style="margin-top: 0;">✨ Take the Vibe Quiz</button>
            </div>
            
            <div id="challengeResult" class="result-box hidden">
                <h3 id="challengeTitle"></h3>
                <p id="challengeText"></p>
                <div id="challengeSwatches" class="palette-grid"></div>
            </div>
        </section>
    </div>

    <!-- The Vibe Quiz Modal (Hidden by default) -->
    <div id="quizModal" class="modal-overlay hidden">
        <div class="bubble-panel quiz-panel">
            <h2 id="quizQuestionText">Question...</h2>
            <div id="quizOptionsContainer" class="quiz-options">
                <!-- Buttons injected by JS -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
